<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B594D" />
    <meta name="description" content="GripWise: guided, gentle rehabilitation for carpal tunnel syndrome." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GripWise</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The styles need a 2023-or-newer browser engine (Chrome 111+). On an outdated Android WebView,
      // explain how to fix it instead of showing a broken screen.
      if (!window.CSS || !CSS.supports('color', 'color-mix(in oklch, red, blue)')) {
        var root = document.getElementById('root');
        root.dataset.unsupported = 'true';
        root.innerHTML =
          '<div style="font-family:sans-serif;padding:32px 24px;color:#15302d;line-height:1.5">' +
          '<h1 style="font-size:22px">Please update Android System WebView</h1>' +
          '<p>GripWise needs a newer version of Android System WebView, the part of Android that displays the app.</p>' +
          '<p>Open the Play Store, search for <b>Android System WebView</b>, tap <b>Update</b>, then reopen GripWise.</p></div>';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gripwise – Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{ tokens }};position:relative;width:390px;height:844px;box-sizing:border-box;background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);display:flex;flex-direction:column;overflow:hidden">
  <div style="flex:1;min-height:0;overflow-y:auto;padding:52px 24px 34px;display:flex;flex-direction:column">
    <a href="Main{{ sfx }}.dc.html" aria-label="Back" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--text);flex-shrink:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M15 6l-6 6 6 6"/></svg></a>

    <div style="margin-top:20px;width:64px;height:64px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--tintBlue)">
      <svg width="40" height="40" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" fill="#2563EB"/><path d="M10 19V11.5M15 19V8.5M20 19v-6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><path d="M8 21.5c4 2.6 10 2.6 14 0" stroke="#F6C34A" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    </div>
    <h1 style="margin:18px 0 6px;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-0.02em">Welcome back</h1>
    <p style="margin:0;font-size:15px;line-height:1.5;color:var(--text2)">Sign in to keep your sessions and progress synced across devices.</p>

    <form style="margin-top:22px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="li-email" style="font-size:13px;font-weight:600">Email</label>
        <input id="li-email" type="email" autocomplete="email" placeholder="you@example.com" value="{{ email }}" onChange="{{ setEmail }}" aria-invalid="{{ emailInvalid }}" aria-describedby="li-email-msg" style="height:52px;border-radius:16px;padding:0 16px;font-family:inherit;font-size:16px;box-sizing:border-box;background:var(--surface);color:var(--text);outline-color:var(--primary);{{ emailBorder }}">
        <sc-if value="{{ emailShow }}" hint-placeholder-val="{{ false }}">
          <p id="li-email-msg" style="margin:0;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--danger)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>{{ emailErr }}</p>
        </sc-if>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="li-pw" style="font-size:13px;font-weight:600">Password</label>
        <div style="position:relative">
          <input id="li-pw" type="{{ pwType }}" autocomplete="current-password" placeholder="Your password" value="{{ pw }}" onChange="{{ setPw }}" aria-invalid="{{ pwInvalid }}" aria-describedby="li-pw-msg" style="width:100%;height:52px;border-radius:16px;padding:0 52px 0 16px;font-family:inherit;font-size:16px;box-sizing:border-box;background:var(--surface);color:var(--text);outline-color:var(--primary);{{ pwBorder }}">
          <button type="button" onClick="{{ togglePw }}" aria-label="{{ pwAria }}" style="position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <sc-if value="{{ pwShow }}" hint-placeholder-val="{{ false }}">
          <p id="li-pw-msg" style="margin:0;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--danger)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>{{ pwErr }}</p>
        </sc-if>
      </div>
      <button type="button" onClick="{{ forgot }}" style="align-self:flex-end;min-height:44px;min-width:44px;padding:0 4px;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--link)">Forgot password?</button>
    </form>

    <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
      <p role="status" style="margin:4px 0 0;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;background:var(--tintBlue);color:var(--accentText)">{{ note }}</p>
    </sc-if>

    <div style="margin-top:16px">
      <sc-if value="{{ valid }}" hint-placeholder-val="{{ false }}">
        <a href="Home{{ sfx }}.dc.html" style="height:56px;border-radius:28px;background:var(--primary);color:var(--onPrimary);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none">Sign in</a>
      </sc-if>
      <sc-if value="{{ invalid }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ trySignIn }}" style="width:100%;height:56px;border-radius:28px;border:0;background:var(--primary);color:var(--onPrimary);font-family:inherit;font-weight:700;font-size:16px;cursor:pointer">Sign in</button>
      </sc-if>
    </div>

    <div style="margin:16px 0;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text3)">
      <span style="flex:1;height:1px;background:var(--line)"></span>or<span style="flex:1;height:1px;background:var(--line)"></span>
    </div>

    <button type="button" onClick="{{ magic }}" style="height:52px;border-radius:26px;font-family:inherit;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>Email me a sign-in link</button>

    <p style="margin:auto 0 0;padding-top:16px;text-align:center;font-size:14px;color:var(--text2)">New to Gripwise? <a href="Signup{{ sfx }}.dc.html" style="display:inline-flex;align-items:center;min-height:44px;font-weight:700;text-decoration:none;color:var(--link)">Create an account</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Light","Dark"],"default":"Light"},"preview":{"editor":"enum","options":["Empty","Errors"],"default":"Empty"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  gw(name) {
    const T = {"Light":{"bg":"#F4F7FB","surface":"#FFFFFF","surface2":"#E8EDF4","raised":"#FFFFFF","text":"#172033","text2":"#4A5568","text3":"#5F6B7E","line":"#E2E8F0","border":"#CBD5E1","primary":"#2563EB","onPrimary":"#FFFFFF","link":"#2563EB","accentText":"#1D4ED8","tintBlue":"#E3EFFD","tintGreen":"#E2F3EC","tintAmber":"#FDEEE0","tintViolet":"#EEEAFB","tintYellow":"#FFF4D6","greenText":"#1F6B50","amberText":"#A4510E","violetText":"#5B47B8","yellowIcon":"#8A5A00","band":"#DCE8FC","ringTrack":"#C9DBF8","track":"rgba(23,32,51,0.08)","bar":"#A9C5F7","danger":"#C62828","dangerTint":"#FDECEC","navy":"#1E3A5F","amberFill":"#E8590C","shadow":"rgba(30,58,95,0.10)","scrim":"rgba(15,22,35,0.45)","gold":"#F6C34A","pale":"#9CC2F7","panel":"#DCEBFC"},"Dark":{"bg":"#000000","surface":"#151515","surface2":"#1A1A1A","raised":"#333333","text":"#F2F2F2","text2":"#B3B3B3","text3":"#8C8C8C","line":"#2A2A2A","border":"#3A3A3A","primary":"#2563EB","onPrimary":"#FFFFFF","link":"#6EA0FF","accentText":"#8AB4FF","tintBlue":"#0F1C33","tintGreen":"#0F2620","tintAmber":"#2E1C10","tintViolet":"#1C1830","tintYellow":"#2A2410","greenText":"#5FD3A5","amberText":"#F5A66B","violetText":"#A99BF0","yellowIcon":"#E8C060","band":"#1D3357","ringTrack":"#23395F","track":"rgba(255,255,255,0.14)","bar":"#2F4E85","danger":"#FF8A80","dangerTint":"#3A1414","navy":"#A8BBD6","amberFill":"#E8590C","shadow":"rgba(0,0,0,0.6)","scrim":"rgba(0,0,0,0.65)","gold":"#F6C34A","pale":"#3D6199","panel":"#0F1C33"}};
    const n = (name || this.props.theme) === 'Dark' ? 'Dark' : 'Light';
    const t = T[n];
    return { tokens: Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';'), sfx: n === 'Dark' ? 'Dark' : '', dark: n === 'Dark' };
  }
  renderVals() {
    const g = this.gw();
    const st = this.state || {};
    const pre = this.props.preview === 'Errors';
    const email = st.email !== undefined ? st.email : (pre ? 'aisyah@' : '');
    const pw = st.pw !== undefined ? st.pw : '';
    const tried = !!st.tried || pre;
    const eErr = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim()) ? '' : (email ? 'Check your email, for example name@example.com.' : 'Enter your email.');
    const pErr = pw ? '' : 'Enter your password.';
    const eShow = (tried || st.emailNeeded) && !!eErr;
    const pShow = tried && !!pErr;
    const ok = !eErr && !pErr;
    return {
      tokens: g.tokens, sfx: g.sfx,
      email: email, pw: pw,
      setEmail: (e) => this.setState({ email: e.target.value }),
      setPw: (e) => this.setState({ pw: e.target.value }),
      emailShow: eShow, emailErr: eErr, emailInvalid: String(eShow), emailBorder: 'border:1.5px solid ' + (eShow ? 'var(--danger)' : 'var(--border)'),
      pwShow: pShow, pwErr: pErr, pwInvalid: String(pShow), pwBorder: 'border:1.5px solid ' + (pShow ? 'var(--danger)' : 'var(--border)'),
      pwType: st.showPw ? 'text' : 'password',
      pwAria: st.showPw ? 'Hide password' : 'Show password',
      togglePw: () => this.setState({ showPw: !st.showPw }),
      valid: ok, invalid: !ok,
      trySignIn: () => this.setState({ tried: true }),
      hasNote: !!st.note,
      note: st.note === 'reset' ? 'We sent a password reset link to ' + email.trim() + '.' : 'Check your inbox. We sent a sign-in link to ' + email.trim() + '.',
      forgot: () => (eErr ? this.setState({ emailNeeded: true, note: '' }) : this.setState({ note: 'reset' })),
      magic: () => (eErr ? this.setState({ emailNeeded: true, note: '' }) : this.setState({ note: 'magic' }))
    };
  }
}
</script>
</body>
</html>

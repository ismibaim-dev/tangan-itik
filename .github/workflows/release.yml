name: Release

# Pushing a version tag (for example v3.0.0), or publishing a release from the web UI, tests the
# code, builds the Android APK and attaches it to the GitHub release. The notes come from that
# version's section of CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3"
            exit 1
          fi
          # Android needs an ever-increasing integer: 1.2.3 becomes 10203.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.name }}"
          awk -v v="$version" '/^## /{ p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest -PskipFlowTest --no-daemon

      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          versions="-PappVersionName=${{ steps.version.outputs.name }} -PappVersionCode=${{ steps.version.outputs.code }}"
          apk="$GITHUB_WORKSPACE/gripwise-$GITHUB_REF_NAME.apk"
          if [ -n "$KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          else
            # No signing secrets: the release build falls back to the repo's public debug key,
            # which stays the same from one release to the next, so updates still install.
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the APK is signed with the repo's debug key"
            cat >> release-notes.md <<'NOTE'

          > **Signing:** this APK is signed with the project's public debug key (no release key is set up yet). Later releases signed the same way install over it.
          NOTE
          fi
          ./gradlew assembleRelease --no-daemon $versions
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cd "$GITHUB_WORKSPACE" && sha256sum "$(basename "$apk")" > "$apk.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Published from the GitHub web UI, which creates the tag and fires this workflow:
            # keep that release and replace its notes with the changelog section.
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Gripwise $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" "gripwise-$GITHUB_REF_NAME.apk" "gripwise-$GITHUB_REF_NAME.apk.sha256" --clobber
